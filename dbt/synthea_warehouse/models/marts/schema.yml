version: 2

models:
  - name: patient_encounter_summary
    columns:
      - name: patient_id
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_patients')
              field: patient_id

  - name: high_utilizers
    columns:
      - name: patient_id
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_patients')
              field: patient_id